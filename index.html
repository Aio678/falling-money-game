<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>天上掉马内</title>
    <!-- Tailwind via CDN is kept for simplicity -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        background-color: #e0f2fe; /* sky-100 */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      /* Custom animation for falling items */
      .falling-item {
        will-change: transform;
      }
      
      /* Player Animations */
      @keyframes leg-move {
        from { transform: rotate(-20deg); }
        to { transform: rotate(20deg); }
      }
      
      .walking .leg-left {
        animation: leg-move 0.2s infinite alternate ease-in-out;
        transform-origin: 40px 100px;
      }
      
      .walking .leg-right {
        animation: leg-move 0.2s infinite alternate-reverse ease-in-out;
        transform-origin: 60px 100px;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      
      .idle .character-body {
        animation: float 2s infinite ease-in-out;
      }

      /* Catch Reaction */
      @keyframes catch-bounce {
        0% { transform: scale(1); }
        40% { transform: scale(1.15) translateY(-5px); }
        100% { transform: scale(1) translateY(0); }
      }
      
      .catching .container-part {
        animation: catch-bounce 0.3s ease-out;
      }

      /* Background Animations */
      @keyframes cloud-drift {
        from { transform: translateX(-150px); }
        to { transform: translateX(100vw); }
      }

      .cloud {
        position: absolute;
        opacity: 0.6;
        animation: cloud-drift linear infinite;
        pointer-events: none;
      }
    </style>
